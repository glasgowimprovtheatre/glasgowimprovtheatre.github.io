---
layout: slideshow-layout-top
title: Slideshow Top
noindex: true
---

<style>
    /* For Webkit (Chrome, Safari) */
    ::-webkit-scrollbar {
        display: none;
    }

    /* For Firefox */
    html {
        scrollbar-width: none;
    }

    /* For Edge & IE */
    body {
        -ms-overflow-style: none;
    }

    :root {
        --top-bg: lightgoldenrodyellow;
        --bottom-bg: black;
        --text-color: black;
        --subtext-color: black;
        --bs-heading-color: black;
    }

    body.dark-mode {
        --top-bg: black;
        --bottom-bg: black;
        --text-color: white;
        --subtext-color: white;
        --bs-heading-color: white;
    }

    body {
        background: linear-gradient(
            to bottom,
            var(--top-bg) 0%,
            var(--top-bg) 25%,
            var(--bottom-bg) 25%,
            var(--bottom-bg) 100%
        );

        min-height: 100vh;
        color: var(--text-color);
        transition: background 0.3s ease, color 0.3s ease;
    }

    h1 {
        font-size: 4rem;
    }

    h2,
    h3 {
        color: var(--subtext-color);
    }

    h3 {
        font-size: 0.8rem;
    }

    .top-bar {
        height: 25vh;
        padding: 1vh 2vw;
    }

    .logo-img {
        height: 22vh;
        width: auto;
    }

    .qr-img {
        height: 16vh;
        width: auto;
    }
</style>

<div>
    <div class="top-bar d-flex align-items-center w-100">

        <div>
            <img
                id="logo"
                src="/img/GIM-logo-transparent-white.png"
                class="logo-img"
            >
        </div>

        <div class="flex-grow-1 text-center">
            <h2 class="mb-0">Glasgow Improv Marathon 2026</h2>
            <h1 class="mb-0" id="currentTeam" contenteditable="true"></h1>
        </div>

        <div class="text-center ms-3">
            <img
                src="/img/qr-code-glasgowimprovmarathon.png"
                class="qr-img"
            >

            <h3 class="mb-0">
                Info / Donate
            </h3>
        </div>

    </div>
</div>

<script>
const teams = [
    "",
    "Falling & Laughing",
    "Yes Leopard",
    "Mara Joy & Friends",

    "Pretty Thistle",
    "tubducky!",
    "Blether",

    "With Bits!",
    "DINGFEST",
    "Smoking cat",

    "Bit shows!",
    "Oops All House M.D Cold Opens",
    "Three Wise Monkeys",
    "Friends",
    "Rings Of Fire",
    "Bingo Break",

    "Date Night",
    "Pencil",
    "Nice Things",

    "Couch (+ Toni/Drew)",
    "Charlie & Mark",
    "Belly Belly",

    "Bounce House",
    "Toni & Drew",

    "Spread",
    "The Dreaming",
    "Saved by the Beep"
];

let currentIndex = 0;

// START IN DARK MODE
let darkMode = true;

document.body.classList.add("dark-mode");

function updateLogo() {
    const logo = document.getElementById("logo");

    logo.src = darkMode
        ? "/img/GIM-logo-transparent-white.png"
        : "/img/GIM-logo-transparent.png";
}
function renderTeam() {
    document.getElementById("currentTeam").textContent = teams[currentIndex];
}

function nextTeam() {
    currentIndex = (currentIndex + 1) % teams.length;
    renderTeam();
}

function prevTeam() {
    currentIndex = (currentIndex - 1 + teams.length) % teams.length;
    renderTeam();
}

function toggleTheme() {
    darkMode = !darkMode;

    document.body.classList.toggle("dark-mode", darkMode);
    updateLogo();
}

document.addEventListener("keydown", function(e) {

    // TEAM NAVIGATION
    if (e.key === "ArrowRight") {
        e.preventDefault();
        nextTeam();
    }

    if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevTeam();
    }

    // THEME TOGGLE
    if (
        e.key === "ArrowUp" ||
        e.key === "ArrowDown"
    ) {
        e.preventDefault();
        toggleTheme();
    }
});

renderTeam();
    updateLogo();
</script>
