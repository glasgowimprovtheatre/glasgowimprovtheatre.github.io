noindex: true
---
<style>
    /* For Webkit (Chrome, Safari) */
    ::-webkit-scrollbar {
    display: none;
    }

    /* For Firefox */
    html {
    scrollbar-width: none;
    }

    /* For Edge & IE */
    body {
    -ms-overflow-style: none;
    }

    body{
        background: linear-gradient(
            to bottom,
            lightgoldenrodyellow 0%,
            lightgoldenrodyellow 25%,
            black 25%,
            black 100%
        );
        min-height: 100vh;
    }
    
    h1{
        font-size: 4rem;
    }
    h3{
        font-size: 0.8rem;
    }

    .top-bar{
        height: 25vh;
        padding: 1vh 2vw;
    }

    .logo-img{
        height: 22vh;
        width: auto;
    }

    .qr-img{
        height: 16vh;
        width: auto;
    }


</style>
<div>
    <div class="top-bar d-flex align-items-center w-100">

        <div>
            <img src="/img/GIM-logo-transparent.png"
                class="logo-img">
        </div>

        <div class="flex-grow-1 text-center">
            <h2 class="mb-0">Glasgow Improv Marathon 2026</h2>
            <h1 class="mb-0" id="currentTeam"></h2>
        </div>

        <div class="text-center ms-3" >
            <img src="/img/qr-code-glasgowimprovmarathon.png"
                class="qr-img">

            <h3 class="mb-0">
                Info / Donate
            </h3>
        </div>

    </div>
</div>

<script>
const teams = [
    "Falling & Laughing",
    "Yes Leopard",
    "Mara Joy & Friends",

    "Pretty Thistle",
    "tubducky!",
    "Blether",

    "With Bits!",
    "DINGFEST",
    "Smoking cat",

    "Bit shows!",

    "Date Night",
    "Pencil",
    "Nice Things",

    "Couch (+ Toni/Drew)",
    "Charlie & Mark",
    "Belly Belly",

    "Bounce House",
    "Toni & Drew",

    "Spread",
    "The Dreaming",
    "Saved by the Beep"
];

let currentIndex = 0;

function renderTeam() {
    document.getElementById("currentTeam").textContent = teams[currentIndex];
}

function nextTeam() {
    currentIndex = (currentIndex + 1) % teams.length;
    renderTeam();
}

function prevTeam() {
    currentIndex = (currentIndex - 1 + teams.length) % teams.length;
    renderTeam();
}

document.addEventListener("keydown", function(e) {
    if (e.key === "ArrowRight") {
        e.preventDefault();
        nextTeam();
    }
    if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevTeam();
    }
});

renderTeam();
</script>
